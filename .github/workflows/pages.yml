# The GitHub Pages site: the docs site (docs-site/, Eleventy and Pagefind,
# PLAN-027) with its live demos and the API reference, from main.
# Smoke-checked under the /bitmark-editor/ sub-path before it deploys.
name: Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a queued run waits rather than cancelling a live one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run build:docs
      - run: npm run build:site
      - name: Smoke check under the sub-path
        run: |
          npx playwright install --with-deps chromium
          npm run test:site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs-site/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
