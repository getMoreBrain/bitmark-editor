# Publish @gmb/bitmark-editor and @gmb/bitmark-editor-angular to npm on a
# version tag (PLAN-024 Phase 7). Both packages share the tag's version
# (npm run release:version -- <version>); a prerelease (v0.2.0-rc.1) goes to
# the `next` dist-tag, anything else to `latest`.
#
# npm authenticates this workflow by OIDC (trusted publishing): no token is
# stored. Each package's trusted publisher on npmjs.com names this repo, this
# workflow file and the `npm` environment. Provenance is added automatically.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      dist-tag: ${{ steps.check.outputs.dist-tag }}
    steps:
      - uses: actions/checkout@v7
      # A release builds from a clean install, never from a cache other
      # workflows wrote.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - id: check
        name: Tag matches both packages, the Angular peer range and the CHANGELOGs
        run: |
          version="${GITHUB_REF_NAME#v}"
          tag="$(node scripts/release.mjs check "$version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dist-tag=$tag" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:package
      - run: npm run build:docs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run build:site
      - run: npm run test:site
      - run: npm run install:angular
      - run: npm run build:angular
      - run: npm run check:package:angular
      - run: npm run test:angular
      - name: The example apps, on tarballs of this build
        run: |
          npm run pack:examples
          npm run install:examples
          npm run build:examples
          npm run test:examples
      - name: Pack the tarballs to publish, and the release notes
        run: |
          mkdir -p release
          npm pack -w @gmb/bitmark-editor --pack-destination release
          (cd packages/bitmark-editor-angular/dist/bitmark-editor-angular && npm pack --pack-destination "$GITHUB_WORKSPACE/release")
          node scripts/release.mjs notes "${{ steps.check.outputs.version }}" > release/NOTES.md
          ls -l release
      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: release

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write # the GitHub Release
      id-token: write # npm trusted publishing
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      DIST_TAG: ${{ needs.verify.outputs.dist-tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: release
      - name: npm supports trusted publishing (11.5.1 or later)
        run: |
          npm --version
          node -e "const [a,b,c]=process.argv[1].split('.').map(Number); if (a<11||(a===11&&(b<5||(b===5&&c<1)))) process.exit(1)" "$(npm --version)"
      # The tarballs verify built and tested. A version already on npm is
      # skipped, so a release that failed half-way can be re-run.
      - name: Publish
        run: |
          for name in @gmb/bitmark-editor @gmb/bitmark-editor-angular; do
            file="release/$(echo "${name#@}" | tr / -)-$VERSION.tgz"
            if npm view "$name@$VERSION" version >/dev/null 2>&1; then
              echo "$name@$VERSION is already on npm: skipped"
            else
              npm publish "$file" --access public --tag "$DIST_TAG"
            fi
          done
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          if [ "$DIST_TAG" = "next" ]; then prerelease="--prerelease"; fi
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" release/*.tgz \
              --title "$GITHUB_REF_NAME" --notes-file release/NOTES.md --verify-tag $prerelease
