<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>bitmark editor: plain TypeScript</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="app-header">
      <h1><b>[.bitmark]</b> editor · plain TypeScript</h1>
      <label>Theme
        <select id="theme">
          <option value="auto">Auto</option>
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
      </label>
    </header>
    <main>
      <div class="panes">
        <section class="pane-card"><h2>bitmark</h2><div id="bitmark" class="pane"></div></section>
        <section class="pane-card"><h2>JSON</h2><div id="json" class="pane"></div></section>
        <section class="pane-card"><h2>HTML · read-only</h2><div id="html" class="pane"></div></section>
      </div>
      <footer class="status-bar">
        <span>Last change: <output id="status">none yet</output></span>
        <button type="button" id="reset">Reset</button>
      </footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
