<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>bitmark editor: plain TypeScript</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header>
      <h1>bitmark editor: plain TypeScript</h1>
      <label>Theme
        <select id="theme">
          <option value="auto">Auto</option>
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
      </label>
    </header>
    <div class="panes">
      <div id="bitmark"></div>
      <div id="json"></div>
      <div id="html"></div>
    </div>
    <p>Last change: <output id="status">none yet</output></p>
    <button type="button" id="reset">Reset</button>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
